name: Keep-alive (Render)

# Mantém o backend no Render (free tier) acordado. O free tier "dorme" após
# ~15 min ocioso, e a 1ª request depois disso demora ~15-25s e pode dar 500.
# Pingando a cada 10 min, a instância (e o pool do Prisma) nunca esfria.
#
# Pinga o endpoint público /api/configuracoes/etapas (não exige login e toca
# o banco, então mantém a conexão quente também).

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (best-effort — o GitHub pode atrasar)
  workflow_dispatch: {} # permite disparar manualmente pra testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          URL="https://helsis-backend.onrender.com/api/configuracoes/etapas"
          echo "Pingando $URL ..."
          # --max-time alto pra absorver o cold start da 1ª chamada.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
          echo "HTTP $code"
          # Cold start pode devolver 500 na 1ª; uma 2ª chamada confirma que acordou.
          if [ "$code" != "200" ]; then
            echo "Primeira resposta $code — reaquecendo com 2ª chamada..."
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
            echo "HTTP $code (2ª)"
          fi
          test "$code" = "200"
